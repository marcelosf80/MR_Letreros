<script>
    /**
     * LÓGICA DEL VISOR DE CORTE (PLANNER)
     * Conectado a los datos de Stock de Google Sheets
     */
    const pScale = 4; // 1cm = 4px
    const pColors = ['#e11d48', '#2563eb', '#16a34a', '#d97706', '#9333ea', '#0d9488', '#ea580c', '#0284c7', '#c026d3', '#65a30d'];
    let pItems = [];
    let pId = null;
    
    // HISTORIAL Y ESTADO (Deshacer / Rehacer)
    let pHistory = [];
    let pHistoryIndex = -1;

    function pSaveState() {
        let state = JSON.parse(JSON.stringify(pItems));
        if (pHistoryIndex < pHistory.length - 1) {
            pHistory = pHistory.slice(0, pHistoryIndex + 1);
        }
        pHistory.push(state);
        if(pHistory.length > 20) pHistory.shift();
        else pHistoryIndex++;
    }

    function pUndo() {
        if (pHistoryIndex > 0) {
            pHistoryIndex--;
            pRestoreState(pHistory[pHistoryIndex]);
        }
    }

    function pRedo() {
        if (pHistoryIndex < pHistory.length - 1) {
            pHistoryIndex++;
            pRestoreState(pHistory[pHistoryIndex]);
        }
    }

    function pRestoreState(state) {
        document.getElementById('plannerContainer').querySelectorAll('.piece').forEach(e => e.remove());
        pItems = JSON.parse(JSON.stringify(state));
        pItems.forEach(it => {
            let el = document.createElement('div');
            el.className = 'piece';
            el.id = it.id;
            el.style.background = `linear-gradient(135deg, ${it.color}66, ${it.color}bb)`;
            el.style.borderColor = it.color;
            pUpdateStyle(el, it);
            el.innerHTML = `
                <div style="font-size:8px;font-weight:900;text-transform:uppercase;text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;">${it.ref}</div>
                <div class="dim-text">${it.w}x${it.h}</div>
                <div class="coords" id="c_${it.id}">x:${Math.round(it.x)} y:${Math.round(it.y)}</div>
                <div class="ctrls">
                    <div class="cbtn cbtn-rot" data-act="rot" title="Girar 90°"><i class="fa-solid fa-rotate"></i></div>
                    <div class="cbtn cbtn-del" data-act="del" title="Eliminar"><i class="fa-solid fa-trash"></i></div>
                </div>
            `;
            el.onmousedown = (e) => pHandlePieceMouseDown(e, el, it.id);
            document.getElementById('plannerContainer').appendChild(el);
        });
        pUpdateStats();
    }

    function openPlanner(id) {
        pId = id;
        pItems = [];
        pHistory = [];
        pHistoryIndex = -1;
        document.getElementById('plannerModal').style.display = 'block';
        document.getElementById('plannerContainer').querySelectorAll('.piece, .nested-item').forEach(e => e.remove());
        
        // Sincronizar datos del producto seleccionado
        let w = parseFloat(document.getElementById('w_'+id).value) || 0;
        let h = parseFloat(document.getElementById('h_'+id).value) || 0;
        let q = parseInt(document.getElementById('q_'+id).value) || 1;
        
        if (window.plannerItemsMap && window.plannerItemsMap['item_' + id]) {
            pItems = JSON.parse(JSON.stringify(window.plannerItemsMap['item_' + id]));
            pItems.forEach(it => pCreateDOM(it));
        } else {
            if(w > 0) {
                document.getElementById('pW').value = w;
                document.getElementById('pH').value = h;
                document.getElementById('pQ').value = q;
            }
        }

        // --- CONEXIÓN CON DATOS DE GOOGLE SHEETS ---
        let p = null; 
        let prodVal = document.getElementById('prod_' + id).value;
        for (let i = 0; i < catalogo.length; i++) { 
            if (catalogo[i].id === prodVal) { p = catalogo[i]; break; } 
        }
        
        let rw = 122; // Default
        if(p && p.anchoFijo) {
            rw = p.anchoFijo;
        } else if(p) {
           let listaStock = stockPorTipo[p.tipo] || [122];
           rw = listaStock.find(s => s >= w) || listaStock[0] || 122;
        }
        
        document.getElementById('plannerRollWidthInput').value = rw;
        document.getElementById('plannerCustomWidthContainer').style.display = 'none';

        pRenderRollButtons(p, rw);

        document.getElementById('pRollInfo').innerText = "ROLLO: " + rw + "cm";
        document.getElementById('plannerContainer').style.width = (rw * pScale) + "px";
        pUpdateStats();
        pSaveState();
    }

    function pRenderRollButtons(p, currentW) {
        let selectEl = document.getElementById('plannerRollSelect');
        selectEl.innerHTML = '';
        if(p && p.anchoFijo) {
            selectEl.innerHTML = `<div class="px-3 py-1.5 rounded bg-blue-600/30 text-blue-300 border border-blue-500/50 text-[10px] font-bold">Fijo: ${p.anchoFijo} cm</div>`;
        } else if(p) {
           let listaStock = stockPorTipo[p.tipo] || [122];
           let foundCustom = true;
           listaStock.forEach(s => {
               let isSel = (s == currentW);
               if(isSel) foundCustom = false;
               let activeClass = isSel ? 'bg-yellow-400 text-black shadow-lg shadow-yellow-400/20 scale-105 border-yellow-400' : 'bg-white/5 text-gray-300 border-white/10 hover:bg-white/10';
               selectEl.innerHTML += `<button type="button" onclick="pChangeRollSelect(${s})" class="px-3 py-1.5 border rounded-lg text-[10px] font-bold transition-all ${activeClass}">${s} cm</button>`;
           });
           
           let customClass = foundCustom ? 'bg-yellow-400 text-black shadow-lg shadow-yellow-400/20 scale-105 border-yellow-400' : 'bg-white/5 text-gray-300 border-white/10 hover:bg-white/10';
           selectEl.innerHTML += `<button type="button" onclick="pChangeRollSelect('custom')" class="px-3 py-1.5 border rounded-lg text-[10px] font-bold transition-all ${customClass}" title="Medida Manual"><i class="fa-solid fa-pen"></i></button>`;
           
           if(foundCustom) document.getElementById('plannerCustomWidthContainer').style.display = 'flex';
        }
    }

    function pChangeRollSelect(val) {
        let pIdVal = pId;
        let p = null; 
        let prodVal = document.getElementById('prod_' + pIdVal).value;
        for (let i = 0; i < catalogo.length; i++) { 
            if (catalogo[i].id === prodVal) { p = catalogo[i]; break; } 
        }

        if (val === 'custom') {
            document.getElementById('plannerCustomWidthContainer').style.display = 'flex';
            pRenderRollButtons(p, document.getElementById('plannerRollWidthInput').value);
        } else {
            document.getElementById('plannerCustomWidthContainer').style.display = 'none';
            document.getElementById('plannerRollWidthInput').value = val;
            pRenderRollButtons(p, val);
        }
        pChangeRollWidth();
    }

    function pChangeRollWidth() {
        let rw = parseFloat(document.getElementById('plannerRollWidthInput').value) || 122;
        document.getElementById('pRollInfo').innerText = "ROLLO: " + rw + "cm";
        document.getElementById('plannerContainer').style.width = (rw * pScale) + "px";
        
        // Evitar que las piezas queden fuera del nuevo ancho
        pItems.forEach(it => {
            if(it.x + it.w > rw) it.x = rw - it.w;
            if(it.x < 0) it.x = 0;
            let el = document.getElementById(it.id);
            if(el) pUpdateStyle(el, it);
        });
        
        pUpdateStats();
    }

    function closePlanner() {  
        document.getElementById('plannerModal').style.display = 'none'; 
    }

    function addPlannerItem() {
        let w = parseFloat(document.getElementById('pW').value);
        let h = parseFloat(document.getElementById('pH').value);
        let q = parseInt(document.getElementById('pQ').value) || 1;
        let ref = document.getElementById('pRef').value.trim() || `Pieza ${pItems.length + 1}`;
        let rw = parseFloat(document.getElementById('plannerRollWidthInput').value);

        if(!w || !h) return;
        if(w > rw && h > rw) { alert("⚠️ La pieza excede el ancho del rollo en ambos sentidos."); return; }

        for(let i=0; i<q; i++) {
            let itemColor = pColors[pItems.length % pColors.length];
            let itemRef = q > 1 ? `${ref} (${i+1}/${q})` : ref;
            let item = { 
                id: 'p' + Date.now() + i, 
                w: w, 
                h: h, 
                x: 0, 
                y: pGetNextY(),
                rotated: false,
                color: itemColor,
                ref: itemRef
            };
            pItems.push(item);
            pCreateDOM(item);
        }
        document.getElementById('pRef').value = ''; // Limpiar
        pUpdateStats();
        pSaveState();
    }

    function pGetNextY() {
        let sep = parseFloat(document.getElementById('pSep').value) || 0;
        if(pItems.length === 0) return sep;
        let max = 0; 
        pItems.forEach(it => { if(it.y + it.h > max) max = it.y + it.h; });
        return max + sep;
    }

    function pCreateDOM(it) {
        let el = document.createElement('div');
        el.className = 'piece';
        el.id = it.id;
        el.style.background = `linear-gradient(135deg, ${it.color}66, ${it.color}bb)`;
        el.style.borderColor = it.color;
        pUpdateStyle(el, it);
        
        el.innerHTML = `
            <div style="font-size:8px;font-weight:900;text-transform:uppercase;text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;">${it.ref}</div>
            <div class="dim-text">${it.w}x${it.h}</div>
            <div class="coords" id="c_${it.id}">x:${Math.round(it.x)} y:${Math.round(it.y)}</div>
            <div class="ctrls">
                <div class="cbtn cbtn-rot" data-act="rot" title="Girar 90°"><i class="fa-solid fa-rotate"></i></div>
                <div class="cbtn cbtn-del" data-act="del" title="Eliminar"><i class="fa-solid fa-trash"></i></div>
            </div>
        `;

        el.onmousedown = (e) => pHandlePieceMouseDown(e, el, it.id);
        document.getElementById('plannerContainer').appendChild(el);
    }

    // DRAG AND DROP GLOBALS
    let pIsDragging = false;
    let pDragEl = null;
    let pDragStartX = 0, pDragStartY = 0;
    let pDragOrigX = 0, pDragOrigY = 0;

    function pHandlePieceMouseDown(e, el, id) {
        if(e.target.closest('.cbtn')) {
            if(e.target.closest('[data-act="del"]')) pRemove(id);
            if(e.target.closest('[data-act="rot"]')) pRotate(id);
            return;
        }
        pIsDragging = true; 
        pDragEl = el;
        pDragStartX = e.clientX - el.offsetLeft; 
        pDragStartY = e.clientY - el.offsetTop; 
        let item = pItems.find(i => i.id === id);
        if(item) { pDragOrigX = item.x; pDragOrigY = item.y; }
        el.style.zIndex = 1000;
    }

    document.addEventListener('mousemove', (e) => {
        if(!pIsDragging || !pDragEl) return;
        let nx = e.clientX - pDragStartX; let ny = e.clientY - pDragStartY;
        let cont = document.getElementById('plannerContainer');
        let mr = cont.offsetWidth - pDragEl.offsetWidth;
        
        // SNAPPING
        if(nx < 8) nx = 0; if(nx > mr - 8) nx = mr; if(ny < 0) ny = 0;
        
        pDragEl.style.left = nx+'px'; pDragEl.style.top = ny+'px';
        let item = pItems.find(i => i.id === pDragEl.id);
        if(item) { 
            item.x = nx/pScale; item.y = ny/pScale; 
            let coordEl = document.getElementById('c_' + item.id);
            if(coordEl) coordEl.textContent = `x:${Math.round(item.x)} y:${Math.round(item.y)}`;
        }
    });

    document.addEventListener('mouseup', () => { 
        if(!pIsDragging || !pDragEl) return;
        pIsDragging = false; pDragEl.style.zIndex = 2; 
        
        let el = pDragEl;
        let item = pItems.find(i => i.id === el.id);
        pDragEl = null;

        if(!item) return;
        let sep = parseFloat(document.getElementById('pSep').value) || 0;
        let buffer = 0.05;
        
        let collided = pItems.some(other => {
            if(other.id === item.id) return false;
            let distX = Math.max(item.x, other.x) - Math.min(item.x + item.w, other.x + other.w);
            let distY = Math.max(item.y, other.y) - Math.min(item.y + item.h, other.y + other.h);
            return distX < (sep - buffer) && distY < (sep - buffer);
        });
        
        if(collided) {
            item.x = pDragOrigX; item.y = pDragOrigY;
            el.style.left = (item.x * pScale) + 'px';
            el.style.top = (item.y * pScale) + 'px';
            let coordEl = document.getElementById('c_' + item.id);
            if(coordEl) coordEl.textContent = `x:${Math.round(item.x)} y:${Math.round(item.y)}`;
            el.style.borderColor = '#ef4444';
            setTimeout(() => { el.style.borderColor = item.color; }, 500);
        } else {
            if(item.x !== pDragOrigX || item.y !== pDragOrigY) {
                pSaveState();
            }
        }
        pUpdateStats();
    });

    function pUpdateStyle(el, it) {
        el.style.width = (it.w * pScale) + 'px';
        el.style.height = (it.h * pScale) + 'px';
        el.style.left = (it.x * pScale) + 'px';
        el.style.top = (it.y * pScale) + 'px';
    }

    function pRotate(id) {
        let it = pItems.find(i => i.id === id);
        let rw = parseFloat(document.getElementById('plannerRollWidthInput').value);
        if(it.h > rw) { alert("No se puede girar: excede el ancho del rollo."); return; }
        
        let oldW = it.w; let oldH = it.h;
        it.w = oldH; it.h = oldW;
        it.rotated = !it.rotated;
        
        let sep = parseFloat(document.getElementById('pSep').value) || 0;
        let buffer = 0.05;
        let collided = pItems.some(other => {
            if(other.id === it.id) return false;
            let distX = Math.max(it.x, other.x) - Math.min(it.x + it.w, other.x + other.w);
            let distY = Math.max(it.y, other.y) - Math.min(it.y + it.h, other.y + other.h);
            return distX < (sep - buffer) && distY < (sep - buffer);
        });
        
        if (collided || it.x + it.w > rw) {
            alert("⚠️ No se puede girar aquí: choca con otra pieza o se sale del rollo.");
            it.w = oldW; it.h = oldH; it.rotated = !it.rotated;
            return;
        }

        let el = document.getElementById(id);
        pUpdateStyle(el, it);
        el.querySelector('.dim-text').innerText = `${it.w}x${it.h}`;
        pUpdateStats();
        pSaveState();
    }

    function pRemove(id) { 
        pItems = pItems.filter(i => i.id !== id); 
        document.getElementById(id).remove(); 
        pUpdateStats(); 
        pSaveState();
    }

    function pAutoOrganize() {
        if(pItems.length === 0) return;
        let rw = parseFloat(document.getElementById('plannerRollWidthInput').value);
        let sep = parseFloat(document.getElementById('pSep').value) || 0;
        
        // Optimizar orientación (hacer que la altura sea menor o igual al ancho para acomodar mejor en filas)
        pItems.forEach(it => {
            if (it.h > it.w && it.h <= rw) {
                let tmp = it.w; it.w = it.h; it.h = tmp;
                it.rotated = !it.rotated;
            }
        });

        // Ordenar de mayor a menor altura
        pItems.sort((a, b) => b.h - a.h);

        let currentX = sep;
        let currentY = sep;
        let rowHeight = 0;

        pItems.forEach(it => {
            if (currentX + it.w > rw) {
                currentY += rowHeight + sep;
                currentX = sep;
                rowHeight = 0;
            }
            it.x = currentX;
            it.y = currentY;
            currentX += it.w + sep;
            if (it.h > rowHeight) rowHeight = it.h;
        });

        // Actualizar UI
        pItems.forEach(it => {
            let el = document.getElementById(it.id);
            pUpdateStyle(el, it);
            let coordEl = document.getElementById('c_' + it.id);
            if(coordEl) coordEl.textContent = `x:${Math.round(it.x)} y:${Math.round(it.y)}`;
            el.querySelector('.dim-text').innerText = `${it.w}x${it.h}`;
        });
        
        pUpdateStats();
        pSaveState();
    }

    function pCenterAll() {
        if(pItems.length === 0) return;
        let rw = parseFloat(document.getElementById('plannerRollWidthInput').value);
        
        let minX = rw;
        let maxX = 0;
        pItems.forEach(it => {
            if(it.x < minX) minX = it.x;
            if(it.x + it.w > maxX) maxX = it.x + it.w;
        });
        
        let currentWidth = maxX - minX;
        if(currentWidth <= 0 || currentWidth > rw) return;
        
        let targetMinX = (rw - currentWidth) / 2;
        let offsetX = targetMinX - minX;
        
        pItems.forEach(it => {
            it.x += offsetX;
            let el = document.getElementById(it.id);
            if(el) {
                pUpdateStyle(el, it);
                let coordEl = document.getElementById('c_' + it.id);
                if(coordEl) coordEl.textContent = `x:${Math.round(it.x)} y:${Math.round(it.y)}`;
            }
        });
        pUpdateStats();
        pSaveState();
    }

    function pRotateAll() {
        if(pItems.length === 0) return;
        let rw = parseFloat(document.getElementById('plannerRollWidthInput').value);
        
        // Girar todas las piezas (intercambiar ancho y alto)
        pItems.forEach(it => {
            let tmp = it.w; it.w = it.h; it.h = tmp;
            it.rotated = !it.rotated;
        });
        
        // Comprobar si alguna pieza excede el rollo
        let exceeds = pItems.some(it => it.w > rw);
        if(exceeds) {
            alert("⚠️ Algunas piezas exceden el ancho del rollo al girarlas 90°.");
            // Revertir
            pItems.forEach(it => {
                let tmp = it.w; it.w = it.h; it.h = tmp;
                it.rotated = !it.rotated;
            });
            return;
        }
        
        pAutoOrganize();
        // pAutoOrganize ya guarda estado
    }

    function pUpdateStats() {
        let maxH = 0; let area = 0;
        pItems.forEach(it => { if(it.y + it.h > maxH) maxH = it.y + it.h; area += (it.w * it.h); });
        let rw = parseFloat(document.getElementById('plannerRollWidthInput').value);
        
        let realH = (maxH - 20) > 0 ? (maxH - 20) : 0;
        document.getElementById('resM').innerText = (realH / 100).toFixed(2) + 'm';
        
        let efficiency = (rw * realH) > 0 ? (area / (rw * realH)) * 100 : 0;
        document.getElementById('resW').innerText = Math.round(100 - efficiency) + '%';
        
        const calculatedHeight = (maxH * pScale) + 800;
        const finalHeight = Math.max(2000, calculatedHeight);
        document.getElementById('plannerContainer').style.minHeight = finalHeight + 'px';
        
        pDrawRulers(rw, maxH + 50);
    }

    function pDrawRulers(w, h) {
        const rh = document.getElementById('rulerH');
        const rv = document.getElementById('rulerV');
        rh.innerHTML = ''; rv.innerHTML = '';

        const rollEl = document.getElementById('plannerContainer');
        const rollHeightPx = rollEl.offsetHeight;
        const rollHeightCm = Math.ceil(rollHeightPx / pScale);

        // Regla Horizontal (Ancho)
        for(let i=0; i<=w; i+=5) {
            const is10 = i % 10 === 0;
            let tick = document.createElement('div');
            tick.className = 'rtick rtick-h' + (is10 ? ' rtick-10' : '');
            tick.style.left = (i * pScale) + 'px';
            tick.style.height = (is10 ? '14px' : '7px');
            rh.appendChild(tick);
            if(is10) {
                let lbl = document.createElement('div');
                lbl.className = 'rlabel';
                lbl.style.left = (i * pScale + 3) + 'px';
                lbl.style.top = '3px';
                lbl.innerText = i;
                rh.appendChild(lbl);
            }
        }

        // Regla Vertical (Largo)
        rv.style.height = rollHeightPx + 'px';
        for(let i=0; i<=rollHeightCm; i+=5) {
            const is10 = i % 10 === 0;
            let tick = document.createElement('div');
            tick.className = 'rtick rtick-v' + (is10 ? ' rtick-10' : '');
            tick.style.top = (i * pScale) + 'px';
            tick.style.width = (is10 ? '14px' : '7px');
            rv.appendChild(tick);
            if(is10) {
                let lbl = document.createElement('div');
                lbl.className = 'rlabel';
                lbl.style.top = (i * pScale + 1) + 'px';
                lbl.style.right = '17px';
                lbl.innerText = i;
                rv.appendChild(lbl);
            }
        }
    }

    function applyPlanner() {
        let maxH = 0; pItems.forEach(it => { if(it.y + it.h > maxH) maxH = it.y + it.h; });
        let realH = Math.ceil(maxH - 20);
        let rw = parseFloat(document.getElementById('plannerRollWidthInput').value);
        
        document.getElementById('w_' + pId).value = rw;
        document.getElementById('h_' + pId).value = realH;
        document.getElementById('q_' + pId).value = 1;
        
        let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${rw}mm" height="${realH}mm" viewBox="0 0 ${rw} ${realH}">`;
        svg += `<rect width="100%" height="100%" fill="#ffffff" stroke="#ccc" stroke-width="0.3"/>`;
        // Marcas de regla SVG
        for (let i = 0; i <= rw; i += 10) svg += `<line x1="${i}" y1="0" x2="${i}" y2="2" stroke="#999" stroke-width="0.1"/><text x="${i}" y="4" font-size="1.5" fill="#999" text-anchor="middle" font-family="Arial">${i}</text>`;
        for (let i = 0; i <= realH; i += 10) svg += `<line x1="0" y1="${i}" x2="2" y2="${i}" stroke="#999" stroke-width="0.1"/><text x="3" y="${i + 0.5}" font-size="1.5" fill="#999" font-family="Arial">${i}</text>`;
        
        pItems.forEach(it => {
            // translate it.y - 20 (porque el area del viewer dejaba un margen, lo quitamos para SVG)
            let fixY = it.y - 20; if(fixY < 0) fixY = 0;
            svg += `<g transform="translate(${it.x}, ${fixY})">`;
            svg += `<rect width="${it.w}" height="${it.h}" fill="${it.color}" fill-opacity="0.15" stroke="${it.color}" stroke-width="0.4"/>`;
            svg += `<text x="${it.w/2}" y="${it.h/2 - 1}" font-size="1.5" text-anchor="middle" font-family="Arial" fill="#000" font-weight="bold">${it.ref}</text>`;
            svg += `<text x="${it.w/2}" y="${it.h/2 + 1.5}" font-size="1.2" text-anchor="middle" font-family="Arial" fill="#444">${it.w}x${it.h}</text>`;
            svg += `</g>`;
        });
        svg += `</svg>`;
        
        if(!window.plannerLayouts) window.plannerLayouts = {};
        window.plannerLayouts['item_' + pId] = svg;

        // GUARDAR ESTADO DE PIEZAS PARA ESTE ID
        if(!window.plannerItemsMap) window.plannerItemsMap = {};
        window.plannerItemsMap['item_' + pId] = JSON.parse(JSON.stringify(pItems));

        calc(); closePlanner();
    }
</script>
