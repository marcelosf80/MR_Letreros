<!DOCTYPE html>
<html lang="es">

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | MR Letreros</title>
    
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syncopate:wght@700&family=Outfit:wght@900&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* =========================================================================
           Variables y Estilos de Maxton Theme + Login
           ========================================================================= */
        :root {
            /* Maxton Variables */
            --bs-primary: #ffffff;
            --bs-secondary: #27272a;
            --bs-success: #22c55e;
            --bs-info: #3b82f6;
            --bs-warning: #eab308;
            --bs-danger: #ef4444;
            --bs-light: #18181b;
            --bs-dark: #09090b;

            --mx-bg-body: #09090b;
            --mx-sidebar-bg: rgba(24, 24, 27, 0.85);
            --mx-sidebar-text: #a1a1aa;
            --mx-card-bg: rgba(24, 24, 27, 0.75);
            --mx-card-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            --mx-card-radius: 16px;
            --bs-font-sans-serif: 'Inter', sans-serif;
            --mx-transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --mx-text: #f4f4f5;

            /* Login Variables */
            --primary: #00f0ff;
            --primary-hover: #ff007f;
            --bg: #09090b;
            --surface: rgba(24, 24, 27, 0.75);
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.05) 0%, transparent 60%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .login-container {
            width: 100%;
            max-width: 380px;
            padding: 1rem;
            z-index: 2;
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
            z-index: 1;
            padding: 1rem 0;
        }

        /* Tarjeta con animación */
        .card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(30px);
            animation: cardEntrance 0.8s cubic-bezier(0.25, 1, 0.5, 1) 4.3s forwards;
        }

        @keyframes cardEntrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Animación Fade In Up para Maxton */
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .mx-card {
            background: var(--mx-card-bg);
            border-radius: var(--mx-card-radius);
            box-shadow: var(--mx-card-shadow);
            border: none;
            transition: var(--mx-transition-smooth);
        }

        .logo {
            text-align: center;
            margin-bottom: 1rem;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.025em;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .logo-wrapper {
            text-align: center;
            margin-bottom: 0.25rem;
        }

        .logo-img {
            max-width: 140px;
            height: auto;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 5px rgba(0, 240, 255, 0.4)) invert(1) brightness(2);
            animation: logoNeonPulse 4s infinite ease-in-out;
        }

        @keyframes logoNeonPulse {
            0%, 100% {
                filter: drop-shadow(0 0 5px rgba(0, 240, 255, 0.4)) drop-shadow(0 0 15px rgba(255, 0, 127, 0.15)) invert(1) brightness(2);
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.75)) drop-shadow(0 0 25px rgba(255, 0, 127, 0.35)) invert(1) brightness(2);
                transform: scale(1.04);
            }
        }

        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(9, 9, 11, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #ffffff;
            font-family: inherit;
            transition: all 0.25s;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(9, 9, 11, 0.85);
            box-shadow: 0 0 0 4px rgba(0, 240, 255, 0.15);
        }

        /* Botón estilo Neón */
        button[type="submit"] {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #00f0ff 0%, #ff007f 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.25);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        button[type="submit"]:hover {
            background: linear-gradient(135deg, #ff007f 0%, #00f0ff 100%);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.35);
            transform: translateY(-2px);
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
            text-shadow: 0 0 5px rgba(239, 68, 68, 0.3);
        }

        /* Fondos Rotativos */
        .carousel-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        .carousel-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .carousel-slide.active {
            opacity: 1;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 9, 11, 0.82); 
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: -1;
        }

        /* Footer */
        .login-footer {
            width: 100%;
            padding: 1rem;
            text-align: center;
            font-size: 0.85rem;
            color: #71717a;
            background: rgba(9, 9, 11, 0.8);
            border-top: 1px solid var(--border);
            z-index: 1;
        }

        .login-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .login-footer a:hover {
            color: var(--primary-hover);
        }

        /* --- INTRO ANIMADA --- */
        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #09090b;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease-in-out, transform 0.8s cubic-bezier(0.85, 0, 0.15, 1);
        }

        .intro-screen.fade-out {
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none;
        }

        .intro-content {
            position: relative;
            width: 95%;
            max-width: 850px;
            text-align: center;
        }

        .intro-svg {
            width: 100%;
            height: auto;
            overflow: visible;
        }

        .intro-text-bg {
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            font-size: 64px;
            letter-spacing: 14px;
            fill: transparent;
            stroke: rgba(255, 215, 0, 0.12);
            stroke-width: 3px;
        }

        .intro-text {
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            font-size: 64px;
            letter-spacing: 14px;
            fill: transparent;
            stroke: #ffd700;
            stroke-width: 2px;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawText 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards,
                       neonFlicker 2s ease-in-out 2.5s forwards;
        }

        .laser-cutter {
            position: absolute;
            top: 0%;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, transparent, #ffd700 30%, #ffffff 50%, #ff8c00 70%, transparent);
            box-shadow: 0 0 15px #ffd700, 0 0 30px #ff8c00, 0 0 50px #ffd700;
            border-radius: 50%;
            opacity: 0;
            animation: laserSweep 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .intro-subtitle {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 12px;
            color: #a1a1aa;
            opacity: 0;
            transform: translateY(10px);
            animation: subtitleFadeIn 1s ease-out 3.0s forwards,
                       subtitleNeon 2s ease-in-out 4.0s infinite alternate;
            text-transform: uppercase;
        }

        @keyframes drawText {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes laserSweep {
            0% {
                left: 2%;
                opacity: 0;
            }
            8% {
                opacity: 1;
            }
            92% {
                opacity: 1;
            }
            100% {
                left: 98%;
                opacity: 0;
            }
        }

        @keyframes neonFlicker {
            0% {
                fill: transparent;
                stroke: #ffd700;
                filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5));
            }
            30% {
                fill: rgba(255, 215, 0, 0.2);
                stroke: #ffffff;
                filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8)) drop-shadow(0 0 30px rgba(255, 140, 0, 0.5));
            }
            100% {
                fill: url(#goldGradient);
                stroke: #ffd700;
                filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.6)) drop-shadow(0 0 25px rgba(255, 140, 0, 0.4));
            }
        }

        @keyframes subtitleFadeIn {
            to {
                opacity: 0.8;
                transform: translateY(0);
            }
        }

        @keyframes subtitleNeon {
            from {
                text-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
                color: #a1a1aa;
            }
            to {
                text-shadow: 0 0 8px #ffd700, 0 0 15px #ff8c00;
                color: #fff;
            }
        }
    </style>
</head>

<body class="bg-light">
    <!-- Intro Animada Cartelería -->
    <div id="introScreen" class="intro-screen">
        <div class="intro-content">
            <svg viewBox="0 0 900 160" class="intro-svg">
                <defs>
                    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ffd700" />
                        <stop offset="50%" stop-color="#fff5b8" />
                        <stop offset="100%" stop-color="#ffb700" />
                    </linearGradient>
                </defs>
                <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" class="intro-text-bg">MR LETREROS</text>
                <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" class="intro-text">MR LETREROS</text>
            </svg>
            <div class="laser-cutter"></div>
            <div class="intro-subtitle">DISEÑO & PRODUCCIÓN GRÁFICA</div>
        </div>
    </div>

    <!-- Carousel Background -->
    <div class="carousel-bg">
        <div class="carousel-slide active" style="background-image: url('https://mrletreros.com.ar/wp-content/uploads/2023/01/carteleria-corporea.jpg');"></div>
        <div class="carousel-slide" style="background-image: url('https://mrletreros.com.ar/wp-content/uploads/2023/01/carteles-luminosos.jpg');"></div>
        <div class="carousel-slide" style="background-image: url('https://mrletreros.com.ar/wp-content/uploads/2023/01/ploteo-vehicular.jpg');"></div>
    </div>
    <div class="bg-overlay"></div>

    <div class="main-wrapper">
        <div class="login-container">
            <div class="card mx-card animate-fade-in-up">
                <!-- Imagen del logo alojada directamente en la web pública -->
                <div class="logo-wrapper">
                    <img src="https://mrletreros.com.ar/assets/img/logo.webp" alt="MR Letreros Logo" class="logo-img">
                </div>
                <div class="logo mb-2">MR Letreros • Acceso</div>

                <!-- Tabs de Iniciar Sesión / Registro -->
                <div class="d-flex mb-3" style="border-bottom: 1px solid rgba(255,255,255,0.1); width: 100%;">
                    <button type="button" id="tabLogin" class="btn w-50 py-2 border-0 bg-transparent fw-bold" style="color: #ffffff; border-bottom: 2px solid #ffd700 !important; border-radius: 0; font-size: 0.85rem; outline: none; box-shadow: none;" onclick="switchTab('login')">Ingresar</button>
                    <button type="button" id="tabRegister" class="btn w-50 py-2 border-0 bg-transparent" style="color: rgba(255,255,255,0.4); border-radius: 0; font-size: 0.85rem; outline: none; box-shadow: none;" onclick="switchTab('register')">Registrar Gremio</button>
                </div>

                <!-- Formulario de Login -->
                <form id="loginForm">
                    <div class="form-group">
                        <label for="usuario">Usuario (Nombre Gremio)</label>
                        <input type="text" id="usuario" name="usuario" required autocomplete="off" autofocus>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña (Teléfono)</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" id="btnSubmit">Ingresar al Sistema</button>
                    <div class="error-msg" id="errorMsg">Credenciales incorrectas</div>
                </form>

                <!-- Formulario de Registro -->
                <form id="registerForm" style="display: none;" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="regNombre">Nombre Gremio / Empresa</label>
                        <input type="text" id="regNombre" name="regNombre" required autocomplete="off" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; outline: none;">
                    </div>
                    <div class="form-group">
                        <label for="regTelefono">WhatsApp / Teléfono</label>
                        <input type="text" id="regTelefono" name="regTelefono" required placeholder="Ej: 1122334455" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; outline: none; margin-top: 5px;">
                        <div style="font-size: 0.75rem; color: #888; margin-top: 5px;">* Tu número de teléfono será tu contraseña para ingresar.</div>
                    </div>
                    <button type="submit" id="btnRegSubmit" style="background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%); color: black; font-weight: bold; width: 100%; padding: 12px; border-radius: 8px; border: none; margin-top: 15px; cursor: pointer; transition: all 0.3s;">Registrarse</button>
                    <div class="error-msg" id="regErrorMsg" style="color: #ff6b6b; font-size: 0.8rem; margin-top: 10px; display: none;"></div>
                    <div class="success-msg" id="regSuccessMsg" style="color: #2ec4b6; font-size: 0.8rem; margin-top: 10px; font-weight: bold; display: none; text-align: center;"></div>
                </form>
            </div>
        </div>
    </div>

    <footer class="login-footer">
        <p>&copy; 2026 MR Letreros. Soluciones gráficas integrales.</p>
        <p>
            <a href="https://mrletreros.com.ar/" target="_blank">Visitar Sitio Web</a> • 
            <a href="https://wa.me/5493426136868" target="_blank">Contacto</a>
        </p>
    </footer>

    <script>
        // Modifica esto por tu URL de API Node pública (ej: http://200.12.34.56:3000)
        const NODE_API_URL = "http://localhost:3000"; 
        
        const webAppUrl = "<?= webAppUrl ?>";

        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const errorMsg = document.getElementById('errorMsg');
            const regErrorMsg = document.getElementById('regErrorMsg');
            const regSuccessMsg = document.getElementById('regSuccessMsg');

            errorMsg.style.display = 'none';
            regErrorMsg.style.display = 'none';
            regSuccessMsg.style.display = 'none';

            if (tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabLogin.style.color = '#ffffff';
                tabLogin.style.fontWeight = 'bold';
                tabLogin.style.borderBottom = '2px solid #ffd700';
                tabRegister.style.color = 'rgba(255, 255, 255, 0.4)';
                tabRegister.style.fontWeight = 'normal';
                tabRegister.style.borderBottom = 'none';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabLogin.style.color = 'rgba(255, 255, 255, 0.4)';
                tabLogin.style.fontWeight = 'normal';
                tabLogin.style.borderBottom = 'none';
                tabRegister.style.color = '#ffffff';
                tabRegister.style.fontWeight = 'bold';
                tabRegister.style.borderBottom = '2px solid #ffd700';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('btnSubmit');
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Verificando...';

            google.script.run
                .withSuccessHandler(function(res) {
                    btn.disabled = false;
                    btn.textContent = 'Ingresar al Sistema';
                    if (res && res.success) {
                        localStorage.setItem('mr_token', res.token);
                        localStorage.setItem('mr_user', JSON.stringify(res.user));
                        window.location.href = webAppUrl + "?page=cotizador";
                    } else {
                        errorMsg.textContent = res.error || 'Error de acceso';
                        errorMsg.style.display = 'block';
                    }
                })
                .withFailureHandler(function(err) {
                    btn.disabled = false;
                    btn.textContent = 'Ingresar al Sistema';
                    errorMsg.textContent = 'Error al verificar gremio: ' + (err.message || err);
                    errorMsg.style.display = 'block';
                })
                .loginGremioUser(usuario, password);
        }

        function handleRegister(e) {
            e.preventDefault();
            const nombre = document.getElementById('regNombre').value.trim();
            const telefono = document.getElementById('regTelefono').value.trim();
            const btn = document.getElementById('btnRegSubmit');
            const errorMsg = document.getElementById('regErrorMsg');
            const successMsg = document.getElementById('regSuccessMsg');

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Registrando...';

            google.script.run
                .withSuccessHandler(function(res) {
                    btn.disabled = false;
                    btn.textContent = 'Registrarse';
                    if (res && res.success) {
                        successMsg.textContent = res.message;
                        successMsg.style.display = 'block';
                        document.getElementById('regNombre').value = '';
                        document.getElementById('regTelefono').value = '';
                        
                        document.getElementById('usuario').value = nombre;
                        document.getElementById('password').value = telefono;

                        setTimeout(() => {
                            switchTab('login');
                        }, 2000);
                    } else {
                        errorMsg.textContent = res.error || 'Error al registrar';
                        errorMsg.style.display = 'block';
                    }
                })
                .withFailureHandler(function(err) {
                    btn.disabled = false;
                    btn.textContent = 'Registrarse';
                    errorMsg.textContent = 'Error al registrar gremio: ' + (err.message || err);
                    errorMsg.style.display = 'block';
                })
                .registerGremioUser(nombre, telefono);
        }

        document.getElementById('loginForm').addEventListener('submit', handleLogin);

        if (localStorage.getItem('mr_token')) {
            window.location.href = webAppUrl + "?page=cotizador";
        }

        const slides = document.querySelectorAll('.carousel-slide');
        let currentSlide = 0;
        if (slides.length > 0) {
            setInterval(() => {
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }, 5000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const intro = document.getElementById('introScreen');
            if (intro) {
                setTimeout(() => {
                    intro.classList.add('fade-out');
                    setTimeout(() => {
                        intro.remove();
                    }, 1000);
                }, 4500);
            }
        });
    </script>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
