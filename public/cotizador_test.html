<!DOCTYPE html>
<html>
<head>
    <link rel="icon" type="image/x-icon" href="/img/logo.ico">
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador Gremio - MR Letreros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #000; color: #f1f1f1; font-family: 'Segoe UI', sans-serif; background-image: radial-gradient(circle at top right, #222 0%, #000 70%); background-attachment: fixed; }
        .glass-card { background: rgba(30, 30, 30, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 215, 0, 0.15); border-radius: 16px; }
        .input-premium { background: rgba(10, 10, 10, 0.8); border: 1px solid #333; color: white; padding: 14px; border-radius: 12px; width: 100%; transition: all 0.3s; }
        .input-premium:focus { border-color: #ffd700; outline: none; box-shadow: 0 0 15px rgba(255, 215, 0, 0.1); }
        .btn-premium { background: linear-gradient(135deg, #ffd700 0%, #ccac00 100%); color: #000; font-weight: 800; border-radius: 12px; cursor: pointer; border:none; width:100%; text-transform: uppercase; letter-spacing: 1px; }
        .file-drop-zone { border: 2px dashed #444; border-radius: 12px; padding: 20px; text-align: center; position: relative; }
        .warning-badge { border: 1px solid transparent; padding: 10px; border-radius: 12px; font-size: 11px; margin-top: 10px; display: none; font-weight: bold; }
        #successOverlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .logo-anim { animation: pulse 2.5s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.02); opacity: 0.9; } }
    </style>
    <!-- ESTILOS MODULARES DEL PLANNER -->
    <style>
    #plannerModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; padding: 20px; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    .planner-content { background: #0f172a; border: 1px solid rgba(255, 215, 0, 0.2); border-radius: 24px; width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 100px rgba(0,0,0,0.9); }
    .planner-sidebar { width: 340px; border-right: 1px solid rgba(255,255,255,0.05); padding: 30px; overflow-y: auto; background: rgba(0,0,0,0.2); }
    .planner-viewer { flex: 1; background: #000; position: relative; overflow: auto; display: flex; justify-content: center; padding: 60px; background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 40px 40px; }
    .roll-container { background: #111; position: relative; border: 2px solid #333; box-shadow: 0 0 60px rgba(0,0,0,0.5); overflow: visible; }
    .waste-layer { position: absolute; inset: 0; top: 20px; background: repeating-linear-gradient(45deg, rgba(239, 68, 68, 0.03), rgba(239, 68, 68, 0.03) 10px, rgba(239, 68, 68, 0.06) 10px, rgba(239, 68, 68, 0.06) 20px); pointer-events: none; }
    .nested-item { position: absolute; background: linear-gradient(135deg, rgba(255, 215, 0, 0.3), rgba(255, 215, 0, 0.5)); border: 2px solid #ffd700; border-radius: 6px; cursor: move; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: 800; z-index: 2; box-shadow: 0 8px 20px rgba(0,0,0,0.5); text-shadow: 0 1px 3px rgba(0,0,0,0.5); transition: border-color 0.2s; }
    .nested-item:hover { border-color: #fff; box-shadow: 0 0 20px rgba(255,215,0,0.5); z-index: 100; }
    .nested-item .controls { position: absolute; top: -14px; right: -14px; display: flex; gap: 6px; opacity: 0; transition: opacity 0.2s; }
    .nested-item:hover .controls { opacity: 1; }
    .item-btn { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; border: 2px solid #0f172a; color: white; transition: transform 0.2s; }
    .item-btn:hover { transform: scale(1.15); }
    .btn-del { background: #f87171; }
    .btn-rot { background: #6366f1; }
    .planner-stat-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 15px; }

    /* Rulers */
    .ruler-h { position: absolute; top: -30px; left: 0; right: 0; height: 30px; background: #080808; border: 1px solid #222; border-bottom: 2px solid #333; overflow: hidden; }
    .ruler-v { position: absolute; top: 0; left: -30px; width: 30px; background: #080808; border: 1px solid #222; border-right: 2px solid #333; overflow: hidden; }
    .ruler-corner { position: absolute; top: -30px; left: -30px; width: 30px; height: 30px; background: #080808; border: 1px solid #222; z-index: 5; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #555; font-weight: 800; }
    .rtick { position: absolute; background: #444; }
    .rtick-h { width: 1px; bottom: 0; }
    .rtick-v { height: 1px; right: 0; }
    .rtick-10 { background: #ffd700 !important; }
    .rlabel { position: absolute; font-size: 8px; color: #666; font-weight: 700; font-family: 'Outfit', sans-serif; }

    /* Items / Pieces */
    .piece { position: absolute; background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 215, 0, 0.35)); border: 2px solid #ffd700; border-radius: 5px; cursor: move; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 800; color: #fff; user-select: none; z-index: 2; box-shadow: 0 6px 18px rgba(0,0,0,0.5); text-shadow: 0 1px 2px rgba(0,0,0,0.6); transition: border-color 0.15s, box-shadow 0.15s; }
    .piece:hover { border-color: #fff; box-shadow: 0 0 25px rgba(255, 215, 0, 0.4); z-index: 100; }
    .piece .ctrls { position: absolute; top: -14px; right: -14px; display: flex; gap: 5px; opacity: 0; transition: opacity 0.15s; }
    .piece:hover .ctrls { opacity: 1; }
    .cbtn { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; border: 2px solid #0f172a; color: #fff; transition: transform 0.2s; }
    .cbtn:hover { transform: scale(1.2); }
    .cbtn-del { background: #f87171; }
    .cbtn-rot { background: #6366f1; }
    .piece .coords { position: absolute; bottom: -16px; left: 0; font-size: 7px; color: #555; font-weight: 600; white-space: nowrap; }
</style>

</head>
<body class="p-4 md:p-8">

        <img src="https://mrletreros.com.ar/assets/img/logo.webp" class="logo-anim mb-8" alt="MR Letreros" style="max-width:300px">

    <div id="plannerModal">
    <div class="planner-content">
        <div class="flex h-full">
            <!-- Sidebar -->
            <div class="planner-sidebar flex flex-col">
                <div class="flex items-center justify-between mb-10">
                    <div>
                        <h3 class="text-yellow-400 font-black italic tracking-tighter text-2xl uppercase">Visor de Corte</h3>

                    <button type="button" onclick="closePlanner()" class="text-gray-600 hover:text-white transition-colors"><i class="fa-solid fa-circle-xmark text-3xl"></i></button>

                <div class="space-y-8">
                    <div class="planner-stat-card">

                            <button type="button" onclick="pAutoOrganize()" class="bg-indigo-600 hover:bg-indigo-500 text-white py-4 px-4 rounded-xl text-xs font-black shadow-lg shadow-indigo-500/20 transition-colors" title="Acomodar Automáticamente">
                                <i class="fa-solid fa-wand-magic-sparkles"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="mt-auto pt-8 border-t border-white/5 space-y-4">
                    <div class="grid grid-cols-2 gap-6">

                    <button type="button" onclick="applyPlanner()" class="btn-premium py-5 bg-gradient-to-r from-yellow-400 to-yellow-600 border-none text-base shadow-xl shadow-yellow-400/10">TRANSFERIR A PEDIDO</button>
                </div>
            </div>
            
            <!-- Viewer -->
            <div class="planner-viewer">
                <div class="roll-wrap" style="position:relative; margin-top:40px; margin-left:40px;">
                    <div class="ruler-corner">cm</div>
                    <div id="rulerH" class="ruler-h"></div>
                    <div id="rulerV" class="ruler-v"></div>
                    <div class="roll-container" id="plannerContainer" style="background:#0d0d0d; position:relative; border:2px solid #333; box-shadow:0 30px 80px -20px rgba(0,0,0,0.9); overflow:visible;">
                        <div class="waste-layer"></div>
                        <div class="absolute -top-12 left-0 right-0 flex items-center justify-center gap-6 opacity-30">
                            <div class="h-[1px] flex-1 bg-white"></div>
                            <div class="text-[11px] text-white font-black uppercase tracking-[0.4em]" id="pRollInfo">ROLLO: 122cm</div>

</div>


    <div class="max-w-4xl mx-auto space-y-8" id="mainContent">
        <header class="flex flex-col items-center space-y-4 mb-10 text-center">
            <img src="https://i.postimg.cc/NFn4MY1f/encabezado-pdf.png" class="w-full h-auto rounded-xl logo-anim" alt="MR Letreros">

        </header>

        <form id="cotizadorForm" class="space-y-6">

            <div class="glass-card p-8 border-t-4 border-yellow-400 shadow-2xl">

    <script>
        var catalogo = [];
        var stockPorTipo = {};
        var itemsCount = 0;
        var filesByItem = {};
        var totalBytes = 0;

        const OPCIONES_POLY = [
            { label: '1.20 x 0.60 m (Placa Completa)', factor: 1.00 },
            { label: '1.00 x 0.60 m', factor: 0.88 },
            { label: '0.80 x 0.60 m', factor: 0.73 },
            { label: '0.60 x 0.60 m (Media Placa)', factor: 0.58 },
            { label: '0.40 x 0.60 m', factor: 0.40 },
            { label: '0.20 x 0.60 m', factor: 0.21 }
        ];

        function init() {
            google.script.run.withSuccessHandler(function(data) {
                catalogo = data.catalog;
                stockPorTipo = data.stock;
                agregarProducto();
            }).getCatalogData();
        }

        function agregarProducto() {
            itemsCount++;
            var id = itemsCount;
            filesByItem['item_' + id] = [];
            var cats = [];
            catalogo.forEach(function(p) { if (cats.indexOf(p.categoria) === -1) cats.push(p.categoria); });

            var html = `<div class="glass-card p-6 md:p-8 relative" id="card_${id}">` +
                `<button type="button" onclick="eliminar(${id})" class="absolute top-4 right-4 text-gray-600 hover:text-red-500"><i class="fa-solid fa-trash-can text-xl"></i></button>` +
                '<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">' +
                `<select id="cat_${id}" class="input-premium" onchange="updateProds(${id})"><option value="">Categoría...</option>` +
                cats.map(function(c) { return '<option value="' + c + '">' + c + '</option>'; }).join('') + '</select>' +
                `<select id="prod_${id}" class="input-premium" onchange="ajustarInputs(${id})"><option value="">Producto...</option></select>` +
                '</div>' +
                `<div id="inputs_container_${id}" class="mb-4"></div>` +
                `<div id="warn_${id}" class="warning-badge mb-4"></div>` +
                `<div id="accept_container_${id}" class="mb-4 hidden bg-orange-500/20 p-3 rounded-xl border border-orange-500/30 transition-all">` +
                `<label class="flex items-center gap-3 cursor-pointer text-orange-200"><input type="checkbox" id="accept_${id}" style="width:20px;height:20px;accent-color:#f97316;"><span class="text-sm font-bold" id="accept_text_${id}">Acepto pagar el desperdicio</span></label></div>` +
                `<textarea id="note_${id}" class="input-premium h-20 mt-4" placeholder="Instrucciones"></textarea>` +
                `<div class="mt-6"><div class="file-drop-zone relative overflow-hidden" id="drop_${id}">` +
                `<input type="file" class="absolute inset-0 opacity-0 cursor-pointer z-10" multiple onchange="handleFiles(this, ${id})">` +
                '<p class="text-sm text-gray-400">Subir archivos (Máx 25MB total)</p></div>' +
                `<div id="list_${id}" class="text-[10px] mt-2 space-y-1 text-left"></div></div>` +
                `<div class="mt-6 pt-4 border-t border-white/5 text-right"><span class="text-2xl font-black text-yellow-400" id="sub_${id}">$0</span></div></div>`;
            document.getElementById('productosContainer').insertAdjacentHTML('beforeend', html);
        }

        function updateProds(id) {
            var cat = document.getElementById('cat_' + id).value;
            var s = document.getElementById('prod_' + id);
            s.innerHTML = '<option value="">Producto...</option>';
            catalogo.forEach(function(p) { if (p.categoria === cat) s.innerHTML += '<option value="' + p.id + '">' + p.producto + '</option>'; });
        }

        function ajustarInputs(id) {
            var p = null; var prodVal = document.getElementById('prod_' + id).value;
            for (var i = 0; i < catalogo.length; i++) { if (catalogo[i].id === prodVal) { p = catalogo[i]; break; } }
            if (!p) return;
            var container = document.getElementById('inputs_container_' + id);
            var esLona = (p.categoria + ' ' + p.producto + ' ' + (p.tipo || '')).toLowerCase().indexOf('lona') > -1;
            var lonaWarningHtml = esLona ? (
                `<div class="md:col-span-3 flex items-start gap-2.5 p-3 bg-amber-500/15 border border-amber-500/30 rounded-xl text-amber-200 text-xs mt-1">` +
                `<i class="fa-solid fa-triangle-exclamation text-amber-400 text-sm mt-0.5"></i>` +
                `<div><strong class="text-amber-300">¡Aviso para Lonas!</strong> Si la lona es <u>para tensar</u> en bastidor o estructura, recordá tildar la opción de <strong>Demasía (+10cm)</strong> para no quedarte corto de material.</div>` +
                `</div>`
            ) : '';

            if (p.categoria.toUpperCase().indexOf('POLIFAN') > -1) {
                container.innerHTML = `<div class="grid grid-cols-2 gap-4"><select id="sup_${id}" class="input-premium" onchange="calc()">${OPCIONES_POLY.map((s,i)=>`<option value="${i}">${s.label}</option>`).join('')}</select><input type="number" id="letras_${id}" placeholder="Cant. Letras" class="input-premium" oninput="calc()"><input type="number" id="q_${id}" value="1" class="input-premium md:col-span-2" oninput="calc()"></div>`;
            } else if (p.unidad === 'm2') {
                container.innerHTML = `<div class="grid grid-cols-3 gap-4">` +
                    `<input type="number" id="w_${id}" placeholder="Ancho cm" class="input-premium" oninput="calc()">` +
                    `<input type="number" id="h_${id}" placeholder="Largo cm" class="input-premium" oninput="calc()">` +
                    `<input type="number" id="q_${id}" value="1" class="input-premium" oninput="calc()">` +
                    `<button type="button" onclick="openPlanner(${id})" class="md:col-span-3 bg-blue-500/20 hover:bg-blue-500/40 text-blue-300 font-bold py-2 px-4 rounded-xl border border-blue-500/30 transition-all text-[10px] uppercase tracking-widest"><i class="fa-solid fa-ruler-combined mr-2"></i> Optimizar Layout Visual</button>` +
                    lonaWarningHtml +
                    `<div class="md:col-span-3 flex items-center gap-3 p-3 bg-white/5 rounded-xl border border-white/10 mt-2">` +
                    `<input type="checkbox" id="dem_${id}" style="width:20px;height:20px;accent-color:#ffd700;" onchange="calc()">` +
                    `<label for="dem_${id}" class="text-xs text-yellow-400 font-bold uppercase cursor-pointer">Agregar demasía de refilado / tensado (+10cm)</label></div></div>`;
            } else if (p.unidad.indexOf('ml') > -1) {
                container.innerHTML = `<div class="grid grid-cols-2 gap-4"><input type="number" id="ml_${id}" placeholder="Metros" class="input-premium" oninput="calc()"><input type="number" id="q_${id}" value="1" class="input-premium" oninput="calc()"></div>`;
            } else {
                container.innerHTML = `<input type="number" id="q_${id}" value="1" class="input-premium" oninput="calc()">`;
            }
            calc();
        }

        function handleFiles(input, id) {
            var files = Array.from(input.files);
            filesByItem['item_' + id] = filesByItem['item_' + id].concat(files);
            totalBytes = 0; Object.keys(filesByItem).forEach(function(k) { filesByItem[k].forEach(function(f) { totalBytes += f.size; }); });
            document.getElementById('list_' + id).innerHTML = filesByItem['item_' + id].map(function(f) { return '<div>✅ ' + f.name + '</div>'; }).join('');
        }

        function calc() {
            var total = 0;
            document.querySelectorAll('[id^="card_"]').forEach(function(card) {
                var id = card.id.replace('card_', '');
                var p = null; var prodVal = document.getElementById('prod_' + id).value;
                for (var i = 0; i < catalogo.length; i++) { if (catalogo[i].id === prodVal) { p = catalogo[i]; break; } }
                if(!p) return;
                var qInput = document.getElementById('q_' + id);
                var q = qInput ? (parseInt(qInput.value) || 1) : 1;

                    sub = (wCob / 100) * (h / 100) * p.precioGremio * q;

    <!-- LÓGICA MODULAR DEL PLANNER -->
    <script>
    /**
     * LÓGICA DEL VISOR DE CORTE (PLANNER)
     * Conectado a los datos de Stock de Google Sheets
     */
    const pScale = 4; // 1cm = 4px
    const pColors = ['#e11d48', '#2563eb', '#16a34a', '#d97706', '#9333ea', '#0d9488', '#ea580c', '#0284c7', '#c026d3', '#65a30d'];
    let pItems = [];
    let pId = null;

    function openPlanner(id) {
        pId = id;
        pItems = [];
        document.getElementById('plannerModal').style.display = 'block';
        document.getElementById('plannerContainer').querySelectorAll('.nested-item').forEach(e => e.remove());
        
        // Sincronizar datos del producto seleccionado
        let w = parseFloat(document.getElementById('w_'+id).value) || 0;
        let h = parseFloat(document.getElementById('h_'+id).value) || 0;
        let q = parseInt(document.getElementById('q_'+id).value) || 1;
        
        if(w > 0) {
            document.getElementById('pW').value = w;
            document.getElementById('pH').value = h;
            document.getElementById('pQ').value = q;
        }

        // --- CONEXIÓN CON DATOS DE GOOGLE SHEETS ---
        let p = null; 
        let prodVal = document.getElementById('prod_' + id).value;
        for (let i = 0; i < catalogo.length; i++) { 
            if (catalogo[i].id === prodVal) { p = catalogo[i]; break; } 
        }
        
        let rw = 122; // Default
        let selectEl = document.getElementById('plannerRollSelect');
        selectEl.innerHTML = '';
        
        if(p && p.anchoFijo) {
            rw = p.anchoFijo;
            selectEl.innerHTML = `<option value="${rw}">Fijo: ${rw} cm</option>`;
            selectEl.disabled = true;
        } else if(p) {
           selectEl.disabled = false;
           let listaStock = stockPorTipo[p.tipo] || [122];
           rw = listaStock.find(s => s >= w) || listaStock[0] || 122;
           
           listaStock.forEach(s => {
               let sel = (s === rw) ? 'selected' : '';
               selectEl.innerHTML += `<option value="${s}" ${sel}>Rollo Stock: ${s} cm</option>`;
           });
           selectEl.innerHTML += `<option value="custom">Otra Medida Manual...</option>`;
        }
        
        document.getElementById('plannerRollSelect').value = rw;
        document.getElementById('plannerRollWidthInput').value = rw;
        document.getElementById('plannerCustomWidthContainer').style.display = 'none';

        document.getElementById('pRollInfo').innerText = "ROLLO: " + rw + "cm";
        document.getElementById('plannerContainer').style.width = (rw * pScale) + "px";
        pUpdateStats();
    }

    function pChangeRollSelect() {
        let val = document.getElementById('plannerRollSelect').value;
        if (val === 'custom') {
            document.getElementById('plannerCustomWidthContainer').style.display = 'flex';
        } else {
            document.getElementById('plannerCustomWidthContainer').style.display = 'none';
            document.getElementById('plannerRollWidthInput').value = val;
        }
        pChangeRollWidth();
    }

    function pChangeRollWidth() {
        let rw = parseFloat(document.getElementById('plannerRollWidthInput').value) || 122;
        document.getElementById('pRollInfo').innerText = "ROLLO: " + rw + "cm";
        document.getElementById('plannerContainer').style.width = (rw * pScale) + "px";
        
        // Evitar que las piezas queden fuera del nuevo ancho
        pItems.forEach(it => {
            if(it.x + it.w > rw) it.x = rw - it.w;
            if(it.x < 0) it.x = 0;
            let el = document.getElementById(it.id);
            if(el) pUpdateStyle(el, it);
        });
        
        pUpdateStats();
    }

    function closePlanner() {  
        document.getElementById('plannerModal').style.display = 'none'; 
    }

    function addPlannerItem() {
        let w = parseFloat(document.getElementById('pW').value);
        let h = parseFloat(document.getElementById('pH').value);
        let q = parseInt(document.getElementById('pQ').value) || 1;
        let ref = document.getElementById('pRef').value.trim() || `Pieza ${pItems.length + 1}`;
        let rw = parseFloat(document.getElementById('plannerRollWidthInput').value);

        if(!w || !h) return;
        if(w > rw && h > rw) { alert("⚠️ La pieza excede el ancho del rollo en ambos sentidos."); return; }

        for(let i=0; i<q; i++) {
            let itemColor = pColors[pItems.length % pColors.length];
            let itemRef = q > 1 ? `${ref} (${i+1}/${q})` : ref;
            let item = { 
                id: 'p' + Date.now() + i, 
                w: w, 
                h: h, 
                x: 0, 
                y: pGetNextY(),
                rotated: false,
                color: itemColor,
                ref: itemRef
            };
            pItems.push(item);
            pCreateDOM(item);
        }
        document.getElementById('pRef').value = ''; // Limpiar
        pUpdateStats();
    }

    function pGetNextY() {
        let sep = parseFloat(document.getElementById('pSep').value) || 0;
        if(pItems.length === 0) return sep;
        let max = 0; 
        pItems.forEach(it => { if(it.y + it.h > max) max = it.y + it.h; });
        return max + sep;
    }

    function pCreateDOM(it) {
        let el = document.createElement('div');
        el.className = 'piece';
        el.id = it.id;
        el.style.background = `linear-gradient(135deg, ${it.color}66, ${it.color}bb)`;
        el.style.borderColor = it.color;
        pUpdateStyle(el, it);
        
        el.innerHTML = `
            <div style="font-size:8px;font-weight:900;text-transform:uppercase;text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;">${it.ref}</div>
            <div class="dim-text">${it.w}x${it.h}</div>
            <div class="coords" id="c_${it.id}">x:${Math.round(it.x)} y:${Math.round(it.y)}</div>
            <div class="ctrls">
                <div class="cbtn cbtn-rot" data-act="rot" title="Girar 90°"><i class="fa-solid fa-rotate"></i></div>
                <div class="cbtn cbtn-del" data-act="del" title="Eliminar"><i class="fa-solid fa-trash"></i></div>
            </div>
        `;

        let isD = false; let sX, sY; let origX, origY;
        el.onmousedown = (e) => { 
            if(e.target.closest('.cbtn')) {
                if(e.target.closest('[data-act="del"]')) pRemove(it.id);
                if(e.target.closest('[data-act="rot"]')) pRotate(it.id);
                return;
            }
            isD = true; sX = e.clientX - el.offsetLeft; sY = e.clientY - el.offsetTop; 
            let item = pItems.find(i => i.id === el.id);
            if(item) { origX = item.x; origY = item.y; }
            el.style.zIndex = 1000;
        };

        document.addEventListener('mousemove', (e) => {
            if(!isD) return;
            let nx = e.clientX - sX; let ny = e.clientY - sY;
            let cont = document.getElementById('plannerContainer');
            let mr = cont.offsetWidth - el.offsetWidth;
            
            // SNAPPING (Ajuste magnético)
            if(nx < 8) nx = 0; if(nx > mr - 8) nx = mr; if(ny < 0) ny = 0;
            
            el.style.left = nx+'px'; el.style.top = ny+'px';
            let item = pItems.find(i => i.id === el.id);
            if(item) { 
                item.x = nx/pScale; item.y = ny/pScale; 
                let coordEl = document.getElementById('c_' + item.id);
                if(coordEl) coordEl.textContent = `x:${Math.round(item.x)} y:${Math.round(item.y)}`;
            }
        });

        document.addEventListener('mouseup', () => { 
            if(!isD) return;
            isD = false; el.style.zIndex = 2; 
            
            let item = pItems.find(i => i.id === el.id);
            if(!item) return;
            let sep = parseFloat(document.getElementById('pSep').value) || 0;
            let buffer = 0.05;
            
            let collided = pItems.some(other => {
                if(other.id === item.id) return false;
                let distX = Math.max(item.x, other.x) - Math.min(item.x + item.w, other.x + other.w);
                let distY = Math.max(item.y, other.y) - Math.min(item.y + item.h, other.y + other.h);
                return distX < (sep - buffer) && distY < (sep - buffer);
            });
            
            if(collided) {
                // Revertir posición si colisiona
                item.x = origX; item.y = origY;
                el.style.left = (item.x * pScale) + 'px';
                el.style.top = (item.y * pScale) + 'px';
                let coordEl = document.getElementById('c_' + item.id);
                if(coordEl) coordEl.textContent = `x:${Math.round(item.x)} y:${Math.round(item.y)}`;
                el.style.borderColor = '#ef4444';
                setTimeout(() => { el.style.borderColor = item.color; }, 500);
            }
            pUpdateStats();
        });
        document.getElementById('plannerContainer').appendChild(el);
    }

    function pUpdateStyle(el, it) {
        el.style.width = (it.w * pScale) + 'px';
        el.style.height = (it.h * pScale) + 'px';
        el.style.left = (it.x * pScale) + 'px';
        el.style.top = (it.y * pScale) + 'px';
    }

    function pRotate(id) {
        let it = pItems.find(i => i.id === id);
        let rw = parseFloat(document.getElementById('plannerRollWidthInput').value);
        if(it.h > rw) { alert("No se puede girar: excede el ancho del rollo."); return; }
        
        let oldW = it.w; let oldH = it.h;
        it.w = oldH; it.h = oldW;
        it.rotated = !it.rotated;
        
        let sep = parseFloat(document.getElementById('pSep').value) || 0;
        let buffer = 0.05;
        let collided = pItems.some(other => {
            if(other.id === it.id) return false;
            let distX = Math.max(it.x, other.x) - Math.min(it.x + it.w, other.x + other.w);
            let distY = Math.max(it.y, other.y) - Math.min(it.y + it.h, other.y + other.h);
            return distX < (sep - buffer) && distY < (sep - buffer);
        });
        
        if (collided || it.x + it.w > rw) {
            alert("⚠️ No se puede girar aquí: choca con otra pieza o se sale del rollo.");
            it.w = oldW; it.h = oldH; it.rotated = !it.rotated;
            return;
        }

        let el = document.getElementById(id);
        pUpdateStyle(el, it);
        el.querySelector('.dim-text').innerText = `${it.w}x${it.h}`;
        pUpdateStats();
    }

    function pRemove(id) { pItems = pItems.filter(i => i.id !== id); document.getElementById(id).remove(); pUpdateStats(); }

    function pAutoOrganize() {
        if(pItems.length === 0) return;
        let rw = parseFloat(document.getElementById('plannerRollWidthInput').value);
        let sep = parseFloat(document.getElementById('pSep').value) || 0;
        
        // Optimizar orientación (hacer que la altura sea menor o igual al ancho para acomodar mejor en filas)
        pItems.forEach(it => {
            if (it.h > it.w && it.h <= rw) {
                let tmp = it.w; it.w = it.h; it.h = tmp;
                it.rotated = !it.rotated;
            }
        });

        // Ordenar de mayor a menor altura
        pItems.sort((a, b) => b.h - a.h);

        let currentX = sep;
        let currentY = sep;
        let rowHeight = 0;

        pItems.forEach(it => {
            if (currentX + it.w > rw) {
                currentY += rowHeight + sep;
                currentX = sep;
                rowHeight = 0;
            }
            it.x = currentX;
            it.y = currentY;
            currentX += it.w + sep;
            if (it.h > rowHeight) rowHeight = it.h;
        });

        // Actualizar UI
        pItems.forEach(it => {
            let el = document.getElementById(it.id);
            pUpdateStyle(el, it);
            let coordEl = document.getElementById('c_' + it.id);
            if(coordEl) coordEl.textContent = `x:${Math.round(it.x)} y:${Math.round(it.y)}`;
            el.querySelector('.dim-text').innerText = `${it.w}x${it.h}`;
        });
        
        pUpdateStats();
    }

    function pUpdateStats() {
        let maxH = 0; let area = 0;
        pItems.forEach(it => { if(it.y + it.h > maxH) maxH = it.y + it.h; area += (it.w * it.h); });
        let rw = parseFloat(document.getElementById('plannerRollWidthInput').value);
        
        let realH = (maxH - 20) > 0 ? (maxH - 20) : 0;
        document.getElementById('resM').innerText = (realH / 100).toFixed(2) + 'm';
        
        let efficiency = (rw * realH) > 0 ? (area / (rw * realH)) * 100 : 0;
        document.getElementById('resW').innerText = Math.round(100 - efficiency) + '%';
        
        const calculatedHeight = (maxH * pScale) + 800;
        const finalHeight = Math.max(2000, calculatedHeight);
        document.getElementById('plannerContainer').style.minHeight = finalHeight + 'px';
        
        pDrawRulers(rw, maxH + 50);
    }

    function pDrawRulers(w, h) {
        const rh = document.getElementById('rulerH');
        const rv = document.getElementById('rulerV');
        rh.innerHTML = ''; rv.innerHTML = '';

        const rollEl = document.getElementById('plannerContainer');
        const rollHeightPx = rollEl.offsetHeight;
        const rollHeightCm = Math.ceil(rollHeightPx / pScale);

        // Regla Horizontal (Ancho)
        for(let i=0; i<=w; i+=5) {
            const is10 = i % 10 === 0;
            let tick = document.createElement('div');
            tick.className = 'rtick rtick-h' + (is10 ? ' rtick-10' : '');
            tick.style.left = (i * pScale) + 'px';
            tick.style.height = (is10 ? '14px' : '7px');
            rh.appendChild(tick);
            if(is10) {
                let lbl = document.createElement('div');
                lbl.className = 'rlabel';
                lbl.style.left = (i * pScale + 3) + 'px';
                lbl.style.top = '3px';
                lbl.innerText = i;
                rh.appendChild(lbl);
            }
        }

        // Regla Vertical (Largo)
        rv.style.height = rollHeightPx + 'px';
        for(let i=0; i<=rollHeightCm; i+=5) {
            const is10 = i % 10 === 0;
            let tick = document.createElement('div');
            tick.className = 'rtick rtick-v' + (is10 ? ' rtick-10' : '');
            tick.style.top = (i * pScale) + 'px';
            tick.style.width = (is10 ? '14px' : '7px');
            rv.appendChild(tick);
            if(is10) {
                let lbl = document.createElement('div');
                lbl.className = 'rlabel';
                lbl.style.top = (i * pScale + 1) + 'px';
                lbl.style.right = '17px';
                lbl.innerText = i;
                rv.appendChild(lbl);
            }
        }
    }

    function applyPlanner() {
        let maxH = 0; pItems.forEach(it => { if(it.y + it.h > maxH) maxH = it.y + it.h; });
        let realH = Math.ceil(maxH - 20);
        let rw = parseFloat(document.getElementById('plannerRollWidthInput').value);
        
        document.getElementById('w_' + pId).value = rw;
        document.getElementById('h_' + pId).value = realH;
        document.getElementById('q_' + pId).value = 1;
        
        let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${rw}mm" height="${realH}mm" viewBox="0 0 ${rw} ${realH}">`;
        svg += `<rect width="100%" height="100%" fill="#ffffff" stroke="#ccc" stroke-width="0.3"/>`;
        // Marcas de regla SVG
        for (let i = 0; i <= rw; i += 10) svg += `<line x1="${i}" y1="0" x2="${i}" y2="2" stroke="#999" stroke-width="0.1"/><text x="${i}" y="4" font-size="1.5" fill="#999" text-anchor="middle" font-family="Arial">${i}</text>`;
        for (let i = 0; i <= realH; i += 10) svg += `<line x1="0" y1="${i}" x2="2" y2="${i}" stroke="#999" stroke-width="0.1"/><text x="3" y="${i + 0.5}" font-size="1.5" fill="#999" font-family="Arial">${i}</text>`;
        
        pItems.forEach(it => {
            // translate it.y - 20 (porque el area del viewer dejaba un margen, lo quitamos para SVG)
            let fixY = it.y - 20; if(fixY < 0) fixY = 0;
            svg += `<g transform="translate(${it.x}, ${fixY})">`;
            svg += `<rect width="${it.w}" height="${it.h}" fill="${it.color}" fill-opacity="0.15" stroke="${it.color}" stroke-width="0.4"/>`;
            svg += `<text x="${it.w/2}" y="${it.h/2 - 1}" font-size="1.5" text-anchor="middle" font-family="Arial" fill="#000" font-weight="bold">${it.ref}</text>`;
            svg += `<text x="${it.w/2}" y="${it.h/2 + 1.5}" font-size="1.2" text-anchor="middle" font-family="Arial" fill="#444">${it.w}x${it.h}</text>`;
            svg += `</g>`;
        });
        svg += `</svg>`;
        
        if(!window.plannerLayouts) window.plannerLayouts = {};
        window.plannerLayouts['item_' + pId] = svg;

        calc(); closePlanner();
    }
</script>
