<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/x-icon" href="/img/logo.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora LED - MR Letreros</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sidebar-universal.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sidebar-universal.css">
    <link rel="stylesheet" href="css/mr-app-theme.css">
    <link rel="stylesheet" href="css/led-wizard.css">
</head>
<body class="led-wizard-page">
    <!-- Sidebar Universal (se inserta automáticamente desde sidebar-universal.js) -->

    <div class="main-content">
        <!-- Top Bar -->
        <div class="mx-topbar">
            <h1 class="top-bar-title m-0"><i class="fas fa-lightbulb"></i> Calculadora LED</h1>
            <div class="top-bar-actions">
                <a href="index.html" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Volver
                </a>
            </div>
        </div>

        <div class="led-wizard-container-wrapper">
            <div class="led-wizard-container">
                <div class="toolbar">
                    <div class="tool-group">
                        <div class="dropdown">
                            <button id="btn-import" class="dropdown-toggle"><i class="fas fa-folder-open"></i> Importar SVG</button>
                            <div class="dropdown-menu" id="import-menu">
                                <a href="#" id="import-from-upload">Subir .svg</a>
                                <a href="#" id="import-from-vectorizer">Del vectorizador</a>
                            </div>
                        </div>
                        <button id="btn-draw"><i class="fas fa-pencil-alt"></i> Dibujar</button>
                        <button id="btn-scale"><i class="fas fa-arrows-alt-h"></i> Escalar</button>
                    </div>
                    <div class="tool-group">
                        <button id="btn-library"><i class="fas fa-book"></i> Librería</button>
                        <button id="btn-export"><i class="fas fa-upload"></i> Exportar</button>
                    </div>
                </div>

                <div class="editor-area">
                    <div id="panel-izq" class="side-panel">
                        <h4><i class="fas fa-tools"></i> Herramientas</h4>
                        <div id="drawing-tools" class="tool-palette"></div>
                        <hr>
                        <h4><i class="fas fa-layer-group"></i> Capas</h4>
                        <div id="layers-panel"></div>
                    </div>

                    <div class="canvas-holder">
                        <canvas id="led-canvas"></canvas>
                    </div>

                    <div id="panel-der" class="side-panel">
                        <h4><i class="fas fa-cogs"></i> Configuración</h4>
                        <div id="config-panel"></div>
                        <hr>
                        <h4><i class="fas fa-chart-bar"></i> Estadísticas</h4>
                        <div id="stats-panel"></div>
                        <hr>
                        <h4><i class="fas fa-ruler-combined"></i> ML de Curvas</h4>
                        <div id="ml-curvas-panel"></div>
                    </div>
                </div>

                <div class="statusbar" style="display:flex;align-items:center;gap:15px">
                    <div style="display:flex;align-items:center;gap:6px">
                        <span id="status-zoom" style="margin-right:2px">Zoom: 100%</span>
                        <button onclick="lw.zoomIn()" class="btn-zoom-control" title="Zoom In"><i class="fas fa-plus"></i></button>
                        <button onclick="lw.zoomOut()" class="btn-zoom-control" title="Zoom Out"><i class="fas fa-minus"></i></button>
                        <button onclick="lw.fitScreen()" class="btn-zoom-control" title="Ajustar al centro"><i class="fas fa-expand"></i></button>
                    </div>
                    <span id="status-cursor">Cursor: 0, 0</span>
                    <span id="status-modules">Módulos: 0</span>
                    <span id="status-watts">Watts: 0W</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals and other hidden elements -->
    <input type="file" id="svg-upload" accept=".svg" style="display: none;">

    <script src="js/auth.js"></script>
    <script src="js/led-wizard/led-wizard-main.js"></script>
    <script src="js/shared/sidebar-universal.js"></script>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
