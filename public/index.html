<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="icon" type="image/x-icon" href="/img/logo.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MR Letreros</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="js/auth.js"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sidebar-universal.css">
    <link rel="stylesheet" href="css/maxton-theme.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body class="bg-light">
    <!-- Sidebar Universal -->
    <div class="main-content">
        <div class="particles" id="particles"></div>

        <div class="mx-topbar">
            <h1 class="top-bar-title m-0">Panel de Control</h1>
            <div class="ms-3 d-none d-md-block" style="flex:1; max-width:60%; overflow:hidden;">
                <marquee id="welcomeMessage" scrollamount="5" style="color:var(--txt-2); font-weight:600; font-size:0.95rem; margin-top:4px;">Cargando trabajos...</marquee>
            </div>
        </div>

        <div class="content-container">
            <!-- Stats Cards -->
            <div class="row g-4 mb-4">
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="stat-card mx-card animate-fade-in-up" style="animation-delay: 0.1s;">
                        <div class="stat-label">⭐ Clientes VIP</div>
                        <div class="stat-value" id="statVipClients">0</div>
                        <div class="small text-success">Clientes destacados</div>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="stat-card mx-card animate-fade-in-up" style="animation-delay: 0.2s;">
                        <div class="stat-label">🔨 Trabajos Activos</div>
                        <div class="stat-value" id="statActiveWorks">0</div>
                        <div class="small text-primary">En proceso</div>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="stat-card mx-card animate-fade-in-up" style="animation-delay: 0.3s;">
                        <div class="stat-label">📊 Rendimiento Mensual</div>
                        <div class="stat-value" id="statMonthlyPerformance">0%</div>
                        <div class="small text-warning">Margen promedio</div>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="stat-card mx-card animate-fade-in-up" style="animation-delay: 0.4s;">
                        <div class="stat-label">✅ Para Entrega</div>
                        <div class="stat-value" id="statReadyDelivery">0</div>
                        <div class="small" style="color: #9C27B0;">Listos para entregar</div>
                    </div>
                </div>
            </div>



            <!-- Upcoming Deliveries -->
            <div class="table-container mx-card animate-fade-in-up mb-4" style="animation-delay: 0.6s;">
                <h3 class="mb-4">🚚 Próximas Entregas</h3>
                <div class="table-responsive">
                    <table class="table table-hover align-middle dashboard-table">
                        <thead class="table-light">
                            <tr>
                                <th>Cliente</th>
                                <th>Trabajo</th>
                                <th>Estado</th>
                                <th>Monto</th>
                                <th>Saldo</th>
                                <th>Pago</th>
                            </tr>
                        </thead>
                        <tbody id="deliveriesTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>



    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared/sidebar-universal.js"></script>
    <script src="js/shared/notification-system.js"></script>
    <script src="js/shared/notification-polling.js"></script>
    <script src="dashboard-main.js"></script>
    <script>
        // Partículas
        const particlesContainer = document.getElementById('particles');
        if (particlesContainer) {
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 5 + 's';
                particlesContainer.appendChild(particle);
            }
        }
    </script>
</body>

</html>
