<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Gastos - MR Letreros</title>
    <script src="js/auth.js"></script>
    <!-- Bootstrap CSS primero para que base.css pueda sobreescribirlo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sidebar-universal.css">
    <link rel="stylesheet" href="css/maxton-theme.css">
    <style>
      /* Overrides para gastos */
      body { background: var(--bg) !important; color: var(--txt) !important; }
      .stat-value {
        font-size: 1.8rem; font-weight: 900; font-style: italic;
        color: var(--txt); margin: 0.4rem 0 0.2rem;
        background: none; -webkit-text-fill-color: unset;
      }
      .stat-label { color: var(--txt-2); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; }
      .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
      /* Fix Bootstrap .btn-close override */
      .btn-close {
        width: 30px !important; height: 30px !important; border-radius: 50% !important;
        background: var(--bg-mid) !important; border: 1px solid transparent !important;
        color: var(--txt-2) !important; cursor: pointer !important; font-size: 1rem !important;
        display: flex !important; align-items: center !important; justify-content: center !important;
        opacity: 1 !important; background-image: none !important;
        transition: all 180ms var(--spring) !important;
      }
      .btn-close:hover { background: #FF9AA2 !important; color: #fff !important; transform: rotate(90deg) scale(1.1); }
      /* Fix Bootstrap modal override */
      .modal { display: none; position: fixed; inset: 0;
        background: rgba(46,43,69,0.5); backdrop-filter: blur(12px);
        z-index: 1060; align-items: center; justify-content: center; padding: 2rem; }
      .modal.active { display: flex !important; }
      /* Gastos table */
      .gastos-table { width: 100%; border-collapse: collapse; }
      .gastos-table th { padding: 10px 14px; text-align: left; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--txt-2); border-bottom: 1px solid var(--glass-border); }
      .gastos-table td { padding: 12px 14px; border-bottom: 1px solid var(--glass-border); font-size: 0.9rem; }
      .gastos-table tr:hover td { background: var(--glass-1); }
      .gastos-table .monto { color: #FF5252; font-weight: 700; }
      .gastos-table .fecha { opacity: 0.6; font-size: 0.85rem; }
    </style>
</head>

<body>
    <!-- Sidebar Universal (se inserta automáticamente) -->

    <div class="main-content">
        <!-- Top Bar -->
        <div class="mx-topbar">
            <h1 class="top-bar-title m-0">💸 Gestión de Gastos</h1>
            <div class="top-bar-actions">
                <button class="btn btn-primary btn-small" onclick="openGastoModal()">➕ Agregar Gasto</button>
            </div>
        </div>

        <div class="content-container">
            <!-- Resumen Simple -->
            <div class="dashboard-grid">
                <div class="stat-card mx-card animate-fade-in-up">
                    <div class="stat-label">Total Gastos (Mes)</div>
                    <div class="stat-value" id="totalGastos" style="color: #FF5252;">$0</div>
                </div>
                <div class="stat-card mx-card animate-fade-in-up">
                    <div class="stat-label">Cantidad de Registros</div>
                    <div class="stat-value" id="countGastos">0</div>
                </div>
            </div>

            <!-- Lista de Gastos -->
            <div class="card mx-card animate-fade-in-up" style="margin-top: 2rem;">
                <div class="card-header">
                    <h2 class="card-title">Historial de Egresos</h2>
                </div>
                <div id="gastList">
                    <p class="empty-state">No hay gastos registrados</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Agregar Gasto -->
    <div class="modal" id="gastoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">💸 Nuevo Gasto</h2>
                <button class="btn-close" onclick="closeGastoModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Concepto / Descripción *</label>
                    <input type="text" id="gastoDesc" placeholder="Ej: Pago a proveedor, Alquiler, etc."
                        class="form-input">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Monto *</label>
                        <input type="number" id="gastoMonto" placeholder="0.00" step="0.01" class="form-input">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Fecha *</label>
                        <input type="date" id="gastoFecha" class="form-input">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeGastoModal()">Cancelar</button>
                <button class="btn btn-primary" id="btnSaveGasto" onclick="saveGasto()">💾 Guardar Gasto</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/shared/data-manager-network.js"></script>
    <script src="js/shared/sidebar-universal.js"></script>
    <script src="js/gastos/gastos-main.js"></script>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
