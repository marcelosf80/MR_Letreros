<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nesting Polifan - MR Letreros</title>
    <script src="js/auth.js"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sidebar-universal.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/maxton-theme.css">

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-glow: rgba(56, 189, 248, 0.2);
            --primary-glow: #0284c7;
        }

        body.has-sidebar {
            background-color: var(--bg-dark);
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .main-content {
            margin-left: 260px;
            padding: 30px;
            transition: all 0.3s;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        body.sidebar-collapsed .main-content {
            margin-left: 80px;
        }

        .mx-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 30px;
        }

        .top-bar-title {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            color: white;
            font-size: 1.8rem;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
            flex-grow: 1;
        }

        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .workspace {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 500px;
        }

        .canvas-area {
            background: rgba(15, 23, 42, 0.6);
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            position: relative;
            min-height: 450px;
            overflow: auto;
            padding: 20px;
            box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: border-color 0.3s;
        }

        .canvas-area.dragover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.05);
        }

        .empty-state {
            text-align: center;
            max-width: 400px;
        }

        .empty-icon {
            font-size: 3.5rem;
            color: #38bdf8;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .sidebar-panel {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .option-group {
            margin-bottom: 20px;
        }

        .option-label {
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
            display: block;
        }

        .input-premium {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 16px;
            color: white;
            font-size: 0.95rem;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        .input-premium:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .quality-toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: rgba(15, 23, 42, 0.5);
            padding: 5px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .quality-btn {
            background: transparent;
            border: none;
            border-radius: 8px;
            padding: 10px;
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s;
            cursor: pointer;
        }

        .quality-btn.active {
            background: #38bdf8;
            color: #0f172a;
            box-shadow: 0 4px 10px rgba(56, 189, 248, 0.3);
        }

        .btn-action-glowing {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px 25px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-action-glowing:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.5);
        }

        .btn-action-glowing:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
            box-shadow: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .stat-val {
            font-size: 1.4rem;
            font-weight: 800;
            color: #38bdf8;
            font-family: 'Outfit', sans-serif;
        }

        .stat-lbl {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 5px;
        }

        /* SVG render container */
        .svg-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .svg-container svg {
            max-width: 100%;
            height: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
        }

        /* Loader */
        .loader-nesting {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(56, 189, 248, 0.1);
            border-left-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .file-info-badge {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary-custom {
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary-custom:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
    </style>
</head>
<body class="has-sidebar">
    <div class="main-content">
        <!-- Top Bar -->
        <div class="mx-topbar">
            <h1 class="top-bar-title m-0"><i class="fa-solid fa-rectangle-list"></i> Nesting Polifan</h1>
            <div class="top-bar-actions">
                <a href="index.html" class="btn-secondary-custom">
                    <i class="fas fa-arrow-left"></i> Volver
                </a>
            </div>
        </div>

        <div class="main-layout">
            <!-- Espacio de trabajo central -->
            <div class="workspace">
                <!-- Tarjeta de Estadísticas (Oculta al inicio) -->
                <div class="glass-card" id="statsCard" style="display: none;">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-val" id="statLength">0 mm</div>
                            <div class="stat-lbl">Largo Plancha</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-val" id="statUsage">0%</div>
                            <div class="stat-lbl">Aprovechamiento</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-val" id="statUnplaced">0</div>
                            <div class="stat-lbl">Sin Colocar</div>
                        </div>
                    </div>
                    <div style="display: flex; gap: 15px; justify-content: flex-end;">
                        <button onclick="downloadNestedSVG()" class="btn-action-glowing" style="width: auto; padding: 10px 25px; font-size: 0.9rem;">
                            <i class="fas fa-download"></i> Descargar Layout SVG
                        </button>
                    </div>
                </div>

                <!-- Canvas / Visualizador de plancha -->
                <div class="canvas-area" id="dropZone">
                    <!-- Estado vacío -->
                    <div class="empty-state" id="emptyState">
                        <i class="fa-solid fa-shapes empty-icon"></i>
                        <h4 style="font-weight: 700; color: white;">Optimiza tus letras de Polifan</h4>
                        <p style="color: #64748b; font-size: 0.9rem;">Sube un archivo de diseño SVG para calcular la mejor posición de las piezas.</p>
                        <button onclick="document.getElementById('svgFileInput').click()" class="btn-secondary-custom" style="margin-top: 15px;">
                            <i class="fas fa-file-upload"></i> Subir archivo SVG
                        </button>
                        <div style="margin-top: 15px;" id="fileBadgeContainer"></div>
                    </div>

                    <!-- Contenedor del SVG renderizado -->
                    <div class="svg-container" id="svgContainer" style="display: none;"></div>

                    <!-- Loader de optimización -->
                    <div id="loader" style="display: none; flex-direction: column; align-items: center; justify-content: center; position: absolute; z-index: 10; background: rgba(15, 23, 42, 0.85); width: 100%; height: 100%; border-radius: 14px;">
                        <div class="loader-nesting"></div>
                        <div style="margin-top: 15px; font-weight: 600; color: white;" id="loaderText">Calculando empaquetado genético...</div>
                    </div>
                </div>
            </div>

            <!-- Sidebar lateral derecho de opciones -->
            <div class="sidebar-panel">
                <div class="glass-card">
                    <h4 style="font-family: 'Outfit', sans-serif; font-weight: 700; color: white; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px;">
                        <i class="fa-solid fa-sliders mr-2"></i> Configuración
                    </h4>

                    <!-- Parámetros de Plancha -->
                    <div class="option-group">
                        <label class="option-label">Ancho de la plancha (mm)</label>
                        <input type="number" id="sheetWidth" class="input-premium" value="1350" min="100" max="3000">
                    </div>

                    <div class="option-group">
                        <label class="option-label">Separación de corte (mm)</label>
                        <input type="number" id="spacing" class="input-premium" value="3" min="0" max="50">
                    </div>

                    <!-- Calidad del algoritmo -->
                    <div class="option-group">
                        <label class="option-label">Calidad / Tiempo</label>
                        <div class="quality-toggle">
                            <button onclick="setQuality(8, 10, this)" class="quality-btn active" id="btnFast">⚡ Borrador</button>
                            <button onclick="setQuality(16, 25, this)" class="quality-btn" id="btnBest">🏆 Óptimo</button>
                        </div>
                    </div>

                    <!-- Botón de ejecución -->
                    <button id="btnNest" onclick="processNesting()" class="btn-action-glowing" disabled style="opacity: 0.6; margin-top: 20px;">
                        <i class="fa-solid fa-bolt"></i> Optimizar Plancha
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Inputs ocultos -->
    <input type="file" id="svgFileInput" accept=".svg" style="display: none;" onchange="handleFileSelect(this)">

    <script>
        let selectedFile = null;
        let nestedSvgContent = null;
        let generations = 10;
        let populationSize = 8;

        // Configurar drag and drop
        const dropZone = document.getElementById('dropZone');
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                const file = e.dataTransfer.files[0];
                if (file.name.toLowerCase().endsWith('.svg')) {
                    setFile(file);
                } else {
                    alert('Por favor, selecciona un archivo vectorial SVG válido.');
                }
            }
        });

        function handleFileSelect(input) {
            if (input.files.length > 0) {
                setFile(input.files[0]);
            }
        }

        function setFile(file) {
            selectedFile = file;
            const badgeContainer = document.getElementById('fileBadgeContainer');
            badgeContainer.innerHTML = `
                <div class="file-info-badge">
                    <i class="fas fa-file-code"></i> ${file.name} (${Math.round(file.size / 1024)} KB)
                </div>
            `;
            document.getElementById('btnNest').disabled = false;
            document.getElementById('btnNest').style.opacity = '1';
        }

        function setQuality(pop, gen, btn) {
            populationSize = pop;
            generations = gen;
            document.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        async function processNesting() {
            if (!selectedFile) return;

            const loader = document.getElementById('loader');
            const loaderText = document.getElementById('loaderText');
            loader.style.display = 'flex';
            loaderText.innerText = 'Preparando vectores y calculando colisiones...';

            const sheetWidth = document.getElementById('sheetWidth').value;
            const spacing = document.getElementById('spacing').value;

            // Form data
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('sheet_width_mm', sheetWidth);
            formData.append('spacing_mm', spacing);
            formData.append('population_size', populationSize);
            formData.append('generations', generations);

            try {
                // Hacer el request a través del helper global de autenticación AUTH.fetch
                const response = await AUTH.fetch('/api/nesting/nest-svg', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errData = await response.json();
                    let errorMsg = 'Error al procesar el nesting';
                    if (errData.detail) errorMsg = errData.detail;
                    else if (errData.details) errorMsg = typeof errData.details === 'string' ? errData.details : (errData.details.detail || JSON.stringify(errData.details));
                    else if (errData.error) errorMsg = errData.error;
                    throw new Error(errorMsg);
                }

                const result = await response.json();
                
                // Mostrar visualización
                document.getElementById('emptyState').style.display = 'none';
                const svgCont = document.getElementById('svgContainer');
                svgCont.style.display = 'flex';
                svgCont.innerHTML = result.nested_svg;
                nestedSvgContent = result.nested_svg;

                // Actualizar estadísticas
                document.getElementById('statsCard').style.display = 'block';
                document.getElementById('statLength').innerText = `${Math.round(result.used_length_mm)} mm`;
                document.getElementById('statUsage').innerText = `${result.utilization_pct}%`;
                document.getElementById('statUnplaced').innerText = result.unplaced_count;
                
                if (result.unplaced_count > 0) {
                    document.getElementById('statUnplaced').style.color = '#ef4444';
                    alert(`¡Atención! No se pudieron colocar ${result.unplaced_count} piezas porque superan el tamaño máximo de la plancha.`);
                } else {
                    document.getElementById('statUnplaced').style.color = '#38bdf8';
                }

            } catch (err) {
                console.error(err);
                alert(`Error: ${err.message}`);
            } finally {
                loader.style.display = 'none';
            }
        }

        function downloadNestedSVG() {
            if (!nestedSvgContent) return;
            const blob = new Blob([nestedSvgContent], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Plancha_Nesting_${selectedFile.name.replace('.svg', '')}.svg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>

    <!-- LÓGICA DEL SIDEBAR UNIVERSAL -->
    <script src="js/shared/sidebar-universal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
