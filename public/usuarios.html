<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - MR Letreros</title>
    <script src="js/auth.js"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sidebar-universal.css">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/maxton-theme.css">
    <link rel="stylesheet" href="css/usuarios.css">
</head>

<body class="bg-light">
    <div class="main-content">
        <div class="mx-topbar">
            <h1 class="top-bar-title m-0">👥 Gestión de Usuarios</h1>
            <button class="btn btn-primary" onclick="openNewUserModal()">➕ Nuevo Usuario</button>
        </div>

        <div class="content-container">
            <div id="usersListContainer">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Usuario</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Dynamic Content -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Nuevo/Editar Usuario -->
    <div class="modal" id="userModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Nuevo Usuario</h2>
                <button class="btn-close" onclick="closeUserModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="userForm">
                    <input type="hidden" id="userId">
                    <div class="form-group">
                        <label class="form-label">Nombre Completo *</label>
                        <input type="text" id="nombre" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Usuario (Login) *</label>
                        <input type="text" id="usuario" class="form-input" required>
                    </div>
                    <div class="form-group" id="passwordGroup">
                        <label class="form-label">Contraseña *</label>
                        <input type="password" id="password" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Rol *</label>
                        <select id="rol" class="form-select" required>
                            <option value="vendedor">Vendedor</option>
                            <option value="produccion">Producción</option>
                            <option value="admin">Administrador</option>
                            <option value="visor">Visor / Auditor</option>
                            <option value="superadmin">SuperAdmin</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Estado</label>
                        <select id="activo" class="form-select">
                            <option value="true">Activo</option>
                            <option value="false">Inactivo</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeUserModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveUser()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal Cambio Password (Admin Override) -->
    <div class="modal" id="pwdModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Cambiar Contraseña</h2>
                <button class="btn-close"
                    onclick="document.getElementById('pwdModal').classList.remove('active')">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="pwdUserId">
                <div class="form-group">
                    <label class="form-label">Nueva Contraseña</label>
                    <input type="password" id="newPassword" class="form-input">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary"
                    onclick="document.getElementById('pwdModal').classList.remove('active')">Cancelar</button>
                <button class="btn btn-primary" onclick="adminChangePassword()">Actualizar</button>
            </div>
        </div>
    </div>

    <script src="js/shared/sidebar-universal.js"></script>
    <script src="js/shared/data-manager-network.js"></script>
    <script src="js/usuarios-manager.js"></script>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
